- name: Deploy fe-dumbmerch Production
  hosts: master
  become: true

  tasks:

    - name: Test koneksi SSH ke GitHub
      ansible.builtin.command:
        cmd: ssh -o StrictHostKeyChecking=no -T git@github.com
      register: github_ssh
      changed_when: false
      failed_when: false

    - name: Clone repository branch production
      ansible.builtin.git:
        repo: "{{ fe_dumbmerch_repo_url }}"
        dest: "{{ fe_dumbmerch_app_dir }}"
        version: production
        key_file: "/home/{{ new_user }}/.ssh/id_ed25519"
        accept_hostkey: true

    - name: Buat Dockerfile multi-stage
      ansible.builtin.copy:
        dest: "{{ fe_dumbmerch_app_dir }}/Dockerfile"
        owner: "{{ new_user }}"
        group: "{{ new_user }}"
        mode: "0644"
        content: |
          FROM node:16-alpine AS builder

          WORKDIR /app

          COPY package*.json ./

          RUN npm install

          COPY . .

          RUN npm run build


          FROM node:16-alpine

          WORKDIR /app

          RUN npm install -g serve

          COPY --from=builder /app/build ./build

          EXPOSE 3000

          CMD ["serve", "-s", "build", "-l", "3000"]

    - name: Login ke private registry
      ansible.builtin.command:
        cmd: >
          docker login registry.daffaalmaas.studentdumbways.my.id
          -u "{{ registry_username }}"
          -p "{{ registry_password }}"
      no_log: true

    - name: Build image fe-dumbmerch
      ansible.builtin.command:
        cmd: >
          docker build
          -t {{ registry_image_frontend_production }}
          .
        chdir: "{{ fe_dumbmerch_app_dir }}"

    - name: Push image fe-dumbmerch ke private registry
      ansible.builtin.command:
        cmd: docker push {{ registry_image_frontend_production }}

    - name: Buat namespace frontend
      ansible.builtin.shell:
        cmd: |
          kubectl create namespace frontend \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Buat Secret private registry
      ansible.builtin.shell:
        cmd: >
          kubectl create secret docker-registry registry-secret
          --namespace frontend
          --docker-server=registry.daffaalmaas.studentdumbways.my.id
          --docker-username="{{ registry_username }}"
          --docker-password="{{ registry_password }}"
          --dry-run=client -o yaml |
          kubectl apply -f -
      no_log: true

    - name: Buat Deployment fe-dumbmerch
      ansible.builtin.copy:
        dest: "{{ fe_dumbmerch_app_dir }}/deployment.yaml"
        owner: "{{ new_user }}"
        group: "{{ new_user }}"
        mode: "0644"
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: fe-dumbmerch
            namespace: frontend
          spec:
            replicas: 1

            selector:
              matchLabels:
                app: fe-dumbmerch

            template:
              metadata:
                labels:
                  app: fe-dumbmerch

              spec:
                imagePullSecrets:
                  - name: registry-secret

                containers:
                  - name: fe-dumbmerch
                    image: "{{ registry_image_frontend_production }}"
                    imagePullPolicy: Always

                    ports:
                      - containerPort: 3000

    - name: Apply Deployment fe-dumbmerch
      ansible.builtin.command:
        cmd: kubectl apply -f {{ fe_dumbmerch_app_dir }}/deployment.yaml

    - name: Buat Service fe-dumbmerch
      ansible.builtin.copy:
        dest: "{{ fe_dumbmerch_app_dir }}/service.yaml"
        owner: "{{ new_user }}"
        group: "{{ new_user }}"
        mode: "0644"
        content: |
          apiVersion: v1
          kind: Service
          metadata:
            name: fe-dumbmerch
            namespace: frontend
          spec:
            selector:
              app: fe-dumbmerch

            ports:
              - protocol: TCP
                port: 3000
                targetPort: 3000

            type: ClusterIP

    - name: Apply Service fe-dumbmerch
      ansible.builtin.command:
        cmd: kubectl apply -f {{ fe_dumbmerch_app_dir }}/service.yaml